name: Rider notification credential transfer
on: workflow_dispatch
permissions: {}
jobs:
  encrypt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: python3 -m pip install --quiet --disable-pip-version-check PyNaCl==1.6.0
      - name: Encrypt robot settings for destination repository
        env:
          NOTIFY_URL: ${{ secrets.BUILD_NOTIFY_WEBHOOK }}
          NOTIFY_KEY: ${{ secrets.BUILD_NOTIFY_SECRET }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode('QjGEe32WAM9PtqMTjhPEOQYydziDYr1jYKSFqHT0mTU=')))
          url, secret = os.environ['NOTIFY_URL'], os.environ['NOTIFY_KEY']
          endpoint = urlsplit(url)
          assert endpoint.scheme == 'https' and endpoint.netloc == 'oapi.dingtalk.com' and endpoint.path == '/robot/send' and secret
          values = {'RIDER_BUILD_NOTIFY_WEBHOOK': url, 'RIDER_BUILD_NOTIFY_SECRET': secret}
          Path('sealed.json').write_text(json.dumps({k: base64.b64encode(box.encrypt(v.encode())).decode() for k,v in values.items()}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rider-notify-sealed
          path: sealed.json
          retention-days: 1
          if-no-files-found: error
