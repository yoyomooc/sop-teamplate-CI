name: Transfer Rider registry credential
on:
  workflow_dispatch:
permissions: {}
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare encryption tool
        run: python3 -m pip install --quiet PyNaCl==1.5.0
      - name: Seal authorized registry password for destination
        env:
          REGISTRY_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64,json,os
          from nacl.public import PublicKey,SealedBox
          value=os.environ['REGISTRY_PASSWORD']
          if not value: raise SystemExit('ALIYUN_PASSWORD is missing.')
          key=PublicKey(base64.b64decode('QjGEe32WAM9PtqMTjhPEOQYydziDYr1jYKSFqHT0mTU='))
          sealed=base64.b64encode(SealedBox(key).encrypt(value.encode())).decode()
          print('RIDER_ENCRYPTED_SECRET='+json.dumps({'key_id':'3380204578043523366','encrypted_value':sealed}))
          PY
