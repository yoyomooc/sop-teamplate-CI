name: build private YoyoBoot source

on:
  repository_dispatch:
    types:
      - yoyoboot-build-request

permissions: {}

concurrency:
  group: yoyoboot-public-build-${{ github.event.client_payload.source_sha || github.run_id }}-${{ github.event.client_payload.request.build_target }}-${{ github.event.client_payload.request.build_mode }}
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.validate.outputs.source_ref }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      source_before_sha: ${{ steps.validate.outputs.source_before_sha }}
      build_intent: ${{ steps.validate.outputs.build_intent }}
      build_target: ${{ steps.validate.outputs.build_target }}
    steps:
      - name: Validate signed request
        id: validate
        shell: bash
        env:
          EXPECTED_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          DISPATCH_HMAC_SECRET: ${{ secrets.PRIVATE_BUILD_DISPATCH_HMAC_SECRET }}
          PROTOCOL: ${{ github.event.client_payload.protocol }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          SOURCE_BEFORE_SHA: ${{ github.event.client_payload.source_before_sha }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          BUILD_INTENT: ${{ github.event.client_payload.request.build_intent }}
          BUILD_TARGET: ${{ github.event.client_payload.request.build_target }}
          BUILD_MODE: ${{ github.event.client_payload.request.build_mode }}
          ISSUED_AT: ${{ github.event.client_payload.issued_at }}
          NONCE: ${{ github.event.client_payload.nonce }}
          SIGNATURE: ${{ github.event.client_payload.signature }}
        run: |
          set -euo pipefail
          [[ -n "$EXPECTED_SOURCE_REPOSITORY" ]] || { echo 'Secret PRIVATE_SOURCE_REPOSITORY is required.' >&2; exit 1; }
          [[ -n "$DISPATCH_HMAC_SECRET" ]] || { echo 'Secret PRIVATE_BUILD_DISPATCH_HMAC_SECRET is required.' >&2; exit 1; }

          export EXPECTED_SOURCE_REPOSITORY DISPATCH_HMAC_SECRET PROTOCOL SOURCE_REPOSITORY SOURCE_REF SOURCE_SHA SOURCE_BEFORE_SHA SOURCE_RUN_ID BUILD_INTENT BUILD_TARGET BUILD_MODE ISSUED_AT NONCE SIGNATURE
          python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          import re
          import sys
          from datetime import datetime, timezone

          values = {name: os.environ[name] for name in (
              'PROTOCOL', 'SOURCE_REPOSITORY', 'SOURCE_REF', 'SOURCE_SHA', 'SOURCE_BEFORE_SHA',
              'SOURCE_RUN_ID', 'BUILD_INTENT', 'BUILD_TARGET', 'BUILD_MODE',
              'ISSUED_AT', 'NONCE', 'SIGNATURE')}
          if values['PROTOCOL'] != 'yoyoboot-public-build/v4':
              sys.exit('Unsupported dispatch protocol.')
          if values['SOURCE_REPOSITORY'] != os.environ['EXPECTED_SOURCE_REPOSITORY']:
              sys.exit('Dispatch source repository is not the configured private source.')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', values['SOURCE_REPOSITORY']):
              sys.exit('Invalid source repository.')
          if not re.fullmatch(r'refs/heads/[A-Za-z0-9._/-]+', values['SOURCE_REF']):
              sys.exit('Only branch refs are accepted.')
          if not re.fullmatch(r'[0-9a-f]{40}', values['SOURCE_SHA']):
              sys.exit('Invalid source SHA.')
          if not re.fullmatch(r'[0-9a-f]{40}', values['SOURCE_BEFORE_SHA']):
              sys.exit('Invalid source before SHA.')
          if not re.fullmatch(r'[1-9][0-9]*', values['SOURCE_RUN_ID']):
              sys.exit('Invalid source run id.')
          if values['BUILD_INTENT'] not in ('ci', 'image'):
              sys.exit('Unsupported build intent.')
          branch = values['SOURCE_REF'].removeprefix('refs/heads/')
          expected_intent = 'image' if branch == 'main' else 'ci' if (
              branch.startswith('dev-') or branch.startswith('codex/') or branch.startswith('code/')
          ) else None
          if values['BUILD_TARGET'] not in ('auto', 'admin', 'docs', 'all') or values['BUILD_MODE'] not in ('auto', 'validate', 'publish'):
              sys.exit('Unsupported build target or mode.')
          if values['BUILD_MODE'] == 'validate' and expected_intent is not None:
              expected_intent = 'ci'
          if values['BUILD_MODE'] == 'publish' and branch != 'main':
              sys.exit('Publication requires main.')
          if expected_intent is None or values['BUILD_INTENT'] != expected_intent:
              sys.exit('Build intent does not match the configured source branch policy.')
          if not re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', values['NONCE']):
              sys.exit('Invalid dispatch nonce.')
          try:
              issued_at = datetime.fromisoformat(values['ISSUED_AT'].replace('Z', '+00:00'))
          except ValueError:
              sys.exit('Invalid dispatch timestamp.')
          if abs((datetime.now(timezone.utc) - issued_at).total_seconds()) > 600:
              sys.exit('Dispatch timestamp is outside the ten-minute acceptance window.')

          material = ''.join(f"{values[key]}\n" for key in (
              'PROTOCOL', 'SOURCE_REPOSITORY', 'SOURCE_REF', 'SOURCE_SHA', 'SOURCE_BEFORE_SHA',
              'SOURCE_RUN_ID', 'BUILD_INTENT', 'BUILD_TARGET', 'BUILD_MODE', 'ISSUED_AT', 'NONCE'))
          expected = base64.b64encode(hmac.new(
              os.environ['DISPATCH_HMAC_SECRET'].encode(), material.encode(), hashlib.sha256).digest()).decode()
          if not hmac.compare_digest(expected, values['SIGNATURE']):
              sys.exit('Dispatch signature is invalid.')
          PY

          {
            echo "source_ref=$SOURCE_REF"
            echo "source_sha=$SOURCE_SHA"
            echo "source_before_sha=$SOURCE_BEFORE_SHA"
            echo "build_intent=$BUILD_INTENT"
            echo "build_target=$BUILD_TARGET"
          } >> "$GITHUB_OUTPUT"

  image-scope:
    needs: validate-request
    runs-on: ubuntu-24.04
    outputs:
      components_json: ${{ steps.scope.outputs.components_json }}
      has_images: ${{ steps.scope.outputs.has_images }}
      has_docs: ${{ steps.scope.outputs.has_docs }}
      quality_scopes: ${{ steps.scope.outputs.quality_scopes }}
    env:
      SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      SOURCE_REF: ${{ needs.validate-request.outputs.source_ref }}
      SOURCE_SHA: ${{ needs.validate-request.outputs.source_sha }}
      SOURCE_BEFORE_SHA: ${{ needs.validate-request.outputs.source_before_sha }}
    steps:
      - name: Check out requested private source range
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source branch still points to requested image commit
        shell: bash
        env:
          SOURCE_READ_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]
          remote_sha="$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${SOURCE_READ_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY}/commits/${SOURCE_REF}" | jq -r '.sha')"
          [[ "$remote_sha" == "$SOURCE_SHA" ]] || { echo 'Source ref moved after image dispatch.' >&2; exit 1; }
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Resolve dependency-aware application image scope
        id: scope
        shell: pwsh
        working-directory: source
        run: >-
          ./scripts/public-build-runner/images/Resolve-YoyoBootImageScope.ps1
          -BaseSha "$env:SOURCE_BEFORE_SHA"
          -HeadSha "$env:SOURCE_SHA"
          -Target '${{ needs.validate-request.outputs.build_target }}'
          -OutputPath "$env:RUNNER_TEMP/yoyoboot-image-scope/image-scope.json"
      - name: Upload image scope evidence
        uses: actions/upload-artifact@v4
        with:
          name: yoyoboot-image-scope-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-image-scope
          if-no-files-found: error

  quality-gate:
    needs: [validate-request, image-scope]
    if: ${{ needs.validate-request.outputs.build_intent == 'ci' && needs.image-scope.outputs.quality_scopes != '[]' }}
    uses: ./.github/workflows/yoyoboot-quality.yml
    with:
      source-ref: ${{ needs.validate-request.outputs.source_ref }}
      source-sha: ${{ needs.validate-request.outputs.source_sha }}
      build-target: ${{ needs.validate-request.outputs.build_target }}
      quality-scopes-json: ${{ needs.image-scope.outputs.quality_scopes }}
    secrets:
      PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      PRIVATE_SOURCE_PAT: ${{ secrets.PRIVATE_SOURCE_PAT }}

  admin-delivery:
    needs: [validate-request, image-scope]
    if: ${{ needs.validate-request.outputs.build_intent == 'image' && needs.image-scope.outputs.has_images == 'true' }}
    uses: ./.github/workflows/yoyoadmin-delivery.yml
    with:
      source-ref: ${{ needs.validate-request.outputs.source_ref }}
      source-sha: ${{ needs.validate-request.outputs.source_sha }}
      components-json: ${{ needs.image-scope.outputs.components_json }}
    secrets:
      PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      PRIVATE_SOURCE_PAT: ${{ secrets.PRIVATE_SOURCE_PAT }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

  docs-delivery:
    needs: [validate-request, image-scope]
    if: ${{ needs.image-scope.outputs.has_docs == 'true' }}
    uses: ./.github/workflows/yoyoboot-docs-delivery.yml
    with:
      source-ref: ${{ needs.validate-request.outputs.source_ref }}
      source-sha: ${{ needs.validate-request.outputs.source_sha }}
      build-intent: ${{ needs.validate-request.outputs.build_intent }}
    secrets:
      PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      PRIVATE_SOURCE_PAT: ${{ secrets.PRIVATE_SOURCE_PAT }}
      DOCKERHUB_TOKEN: ${{ needs.validate-request.outputs.build_intent == 'image' && secrets.DOCKERHUB_TOKEN || '' }}
      ALIYUN_PASSWORD: ${{ needs.validate-request.outputs.build_intent == 'image' && secrets.ALIYUN_PASSWORD || '' }}

  notify:
    needs: [validate-request, image-scope, quality-gate, admin-delivery, docs-delivery]
    if: ${{ always() && needs.validate-request.result == 'success' }}
    uses: ./.github/workflows/yoyoboot-notify.yml
    with:
      source-ref: ${{ needs.validate-request.outputs.source_ref }}
      source-sha: ${{ needs.validate-request.outputs.source_sha }}
      build-intent: ${{ needs.validate-request.outputs.build_intent }}
      results-json: ${{ toJSON(needs) }}
    secrets:
      PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      PRIVATE_SOURCE_PAT: ${{ secrets.PRIVATE_SOURCE_PAT }}
      BUILD_NOTIFY_WEBHOOK: ${{ secrets.BUILD_NOTIFY_WEBHOOK }}
      BUILD_NOTIFY_SECRET: ${{ secrets.BUILD_NOTIFY_SECRET }}
