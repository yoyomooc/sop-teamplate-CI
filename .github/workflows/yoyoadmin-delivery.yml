name: Yoyo Admin image delivery

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      components-json:
        type: string
        required: true
    secrets:
      PRIVATE_SOURCE_REPOSITORY:
        required: true
      PRIVATE_SOURCE_PAT:
        required: true
      DOCKERHUB_TOKEN:
        required: false
      ALIYUN_PASSWORD:
        required: false
    outputs:
      result:
        value: ${{ jobs.delivery-result.outputs.result }}
      has-primary:
        value: ${{ jobs.delivery-result.outputs.has-primary }}
      mirror-result:
        value: ${{ jobs.delivery-result.outputs.mirror-result }}
      component-results-json:
        value: ${{ jobs.delivery-result.outputs.component-results-json }}

permissions: {}

jobs:
  build-yoyoadmin-web:
    if: ${{ contains(fromJson(inputs.components-json), 'yoyoadmin-web') }}
    runs-on: ubuntu-24.04
    environment: oci-image-publisher
    env:
      SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      SOURCE_REF: ${{ inputs.source-ref }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      COMPONENT_ID: yoyoadmin-web
      COMPONENTS_JSON: '["yoyoadmin-web"]'
      PRIMARY_REGISTRY: docker.io
      PRIMARY_REPOSITORY_PREFIX: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out requested private source revision
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Validate Docker Hub primary configuration
        shell: bash
        env:
          PRIMARY_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PRIMARY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$PRIMARY_REPOSITORY_PREFIX" && -n "$PRIMARY_USERNAME" && -n "$PRIMARY_PASSWORD" ]] || {
            echo 'Docker Hub primary registry configuration is required for image intent.' >&2
            exit 1
          }
      - name: Sign in to Docker Hub primary
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PRIMARY_REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish yoyoadmin-web exact-SHA image to primary
        shell: pwsh
        working-directory: source
        run: >-
          ./scripts/public-build-runner/images/Invoke-YoyoBootPublicImageBuild.ps1
          -OutputDirectory "$env:RUNNER_TEMP/yoyoboot-public-build-$env:COMPONENT_ID"
          -ImageRegistry "$env:PRIMARY_REGISTRY"
          -ImageRepositoryPrefix "$env:PRIMARY_REPOSITORY_PREFIX"
          -ComponentsJson "$env:COMPONENTS_JSON"
          -PushImages
      - name: Upload yoyoadmin-web primary manifest and build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yoyoboot-image-yoyoadmin-web-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-public-build-yoyoadmin-web
          if-no-files-found: warn

  build-yoyoadmin-hostapi:
    if: ${{ contains(fromJson(inputs.components-json), 'yoyoadmin-hostapi') }}
    runs-on: ubuntu-24.04
    environment: oci-image-publisher
    env:
      SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      SOURCE_REF: ${{ inputs.source-ref }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      COMPONENT_ID: yoyoadmin-hostapi
      COMPONENTS_JSON: '["yoyoadmin-hostapi"]'
      PRIMARY_REGISTRY: docker.io
      PRIMARY_REPOSITORY_PREFIX: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out requested private source revision
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Validate Docker Hub primary configuration
        shell: bash
        env:
          PRIMARY_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PRIMARY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$PRIMARY_REPOSITORY_PREFIX" && -n "$PRIMARY_USERNAME" && -n "$PRIMARY_PASSWORD" ]] || exit 1
      - name: Sign in to Docker Hub primary
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PRIMARY_REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish yoyoadmin-hostapi exact-SHA image to primary
        shell: pwsh
        working-directory: source
        run: >-
          ./scripts/public-build-runner/images/Invoke-YoyoBootPublicImageBuild.ps1
          -OutputDirectory "$env:RUNNER_TEMP/yoyoboot-public-build-$env:COMPONENT_ID"
          -ImageRegistry "$env:PRIMARY_REGISTRY"
          -ImageRepositoryPrefix "$env:PRIMARY_REPOSITORY_PREFIX"
          -ComponentsJson "$env:COMPONENTS_JSON"
          -PushImages
      - name: Upload yoyoadmin-hostapi primary manifest and build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yoyoboot-image-yoyoadmin-hostapi-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-public-build-yoyoadmin-hostapi
          if-no-files-found: warn

  build-yoyoadmin-migrator:
    if: ${{ contains(fromJson(inputs.components-json), 'yoyoadmin-migrator') }}
    runs-on: ubuntu-24.04
    environment: oci-image-publisher
    env:
      SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      SOURCE_REF: ${{ inputs.source-ref }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      COMPONENT_ID: yoyoadmin-migrator
      COMPONENTS_JSON: '["yoyoadmin-migrator"]'
      PRIMARY_REGISTRY: docker.io
      PRIMARY_REPOSITORY_PREFIX: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out requested private source revision
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Validate Docker Hub primary configuration
        shell: bash
        env:
          PRIMARY_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PRIMARY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$PRIMARY_REPOSITORY_PREFIX" && -n "$PRIMARY_USERNAME" && -n "$PRIMARY_PASSWORD" ]] || exit 1
      - name: Sign in to Docker Hub primary
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PRIMARY_REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish yoyoadmin-migrator exact-SHA image to primary
        shell: pwsh
        working-directory: source
        run: >-
          ./scripts/public-build-runner/images/Invoke-YoyoBootPublicImageBuild.ps1
          -OutputDirectory "$env:RUNNER_TEMP/yoyoboot-public-build-$env:COMPONENT_ID"
          -ImageRegistry "$env:PRIMARY_REGISTRY"
          -ImageRepositoryPrefix "$env:PRIMARY_REPOSITORY_PREFIX"
          -ComponentsJson "$env:COMPONENTS_JSON"
          -PushImages
      - name: Upload yoyoadmin-migrator primary manifest and build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yoyoboot-image-yoyoadmin-migrator-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-public-build-yoyoadmin-migrator
          if-no-files-found: warn

  image-summary:
    needs: [ build-yoyoadmin-web, build-yoyoadmin-hostapi, build-yoyoadmin-migrator]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    outputs:
      has_primary: ${{ steps.summary.outputs.has_primary }}
      lane_result: ${{ steps.summary.outputs.lane_result }}
    env:
      SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      SOURCE_REF: ${{ inputs.source-ref }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - name: Check out image summary owner
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Download yoyoadmin-web manifest
        if: ${{ needs.build-yoyoadmin-web.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: yoyoboot-image-yoyoadmin-web-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-primary-components/yoyoadmin-web
      - name: Download yoyoadmin-hostapi manifest
        if: ${{ needs.build-yoyoadmin-hostapi.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: yoyoboot-image-yoyoadmin-hostapi-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-primary-components/yoyoadmin-hostapi
      - name: Download yoyoadmin-migrator manifest
        if: ${{ needs.build-yoyoadmin-migrator.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: yoyoboot-image-yoyoadmin-migrator-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-primary-components/yoyoadmin-migrator
      - name: Merge component results into image manifest
        id: summary
        shell: pwsh
        working-directory: source
        run: >-
          ./scripts/public-build-runner/images/Merge-YoyoBootImagePrimaryResults.ps1
          -InputDirectory "$env:RUNNER_TEMP/yoyoboot-primary-components"
          -OutputDirectory "$env:RUNNER_TEMP/yoyoboot-image-summary"
          -SourceSha "$env:SOURCE_SHA"
          -SourceRef "$env:SOURCE_REF"
          -SourceRepository "$env:SOURCE_REPOSITORY"
          -ScopeComponentsJson '${{ inputs.components-json }}'
          -WebResult '${{ needs.build-yoyoadmin-web.result }}'
          -HostApiResult '${{ needs.build-yoyoadmin-hostapi.result }}'
          -MigratorResult '${{ needs.build-yoyoadmin-migrator.result }}'
      - name: Upload image summary manifest
        uses: actions/upload-artifact@v4
        with:
          name: yoyoboot-image-summary-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-image-summary
          if-no-files-found: error

  image-mirror-aliyun:
    needs: image-summary
    if: ${{ always() && needs.image-summary.result == 'success' && needs.image-summary.outputs.has_primary == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: aliyun-chengdu
            registry: ${{ vars.ALIYUN_DOCKERHUB }}
          - name: aliyun-hong-kong
            registry: ${{ vars.ALIYUN_HK_DOCKERHUB }}
    runs-on: ubuntu-24.04
    environment: oci-image-publisher
    env:
      SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      TARGET_NAME: ${{ matrix.target.name }}
      TARGET_REGISTRY: ${{ matrix.target.registry }}
      TARGET_REPOSITORY_PREFIX: yoyosoft
    steps:
      - name: Check out mirror publication owner
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Download primary image summary
        uses: actions/download-artifact@v5
        with:
          name: yoyoboot-image-summary-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-primary-summary
      - name: Validate Aliyun mirror configuration
        shell: bash
        env:
          TARGET_USERNAME: ${{ vars.ALIYUN_USERNAME }}
          TARGET_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$TARGET_REGISTRY" && -n "$TARGET_USERNAME" && -n "$TARGET_PASSWORD" ]] || {
            echo "Aliyun mirror configuration is required for ${TARGET_NAME}." >&2
            exit 1
          }
      - name: Sign in to Aliyun mirror
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TARGET_REGISTRY }}
          username: ${{ vars.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Mirror exact-SHA images and verify digest identity
        shell: pwsh
        working-directory: source
        run: >-
          ./apps/yoyo-admin/packaging/Publish-YoyoAdminImageMirror.ps1
          -PrimaryManifestPath "$env:RUNNER_TEMP/yoyoboot-primary-summary/image-manifest.json"
          -TargetRegistry "$env:TARGET_REGISTRY"
          -TargetRepositoryPrefix "$env:TARGET_REPOSITORY_PREFIX"
          -TargetName "$env:TARGET_NAME"
          -OutputDirectory "$env:RUNNER_TEMP/yoyoboot-image-mirror-$env:TARGET_NAME"
      - name: Upload mirror evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yoyoboot-images-${{ env.TARGET_NAME }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-image-mirror-${{ env.TARGET_NAME }}
          if-no-files-found: warn

  delivery-result:
    needs: [build-yoyoadmin-web, build-yoyoadmin-hostapi, build-yoyoadmin-migrator, image-summary, image-mirror-aliyun]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ needs.image-summary.outputs.lane_result || needs.image-summary.result }}
      has-primary: ${{ needs.image-summary.outputs.has_primary }}
      mirror-result: ${{ needs.image-mirror-aliyun.result }}
      component-results-json: ${{ format('{{"yoyoadmin-web":"{0}","yoyoadmin-hostapi":"{1}","yoyoadmin-migrator":"{2}"}}', needs.build-yoyoadmin-web.result, needs.build-yoyoadmin-hostapi.result, needs.build-yoyoadmin-migrator.result) }}
    steps:
      - name: Record delivery results
        env:
          PRIMARY_RESULT: ${{ needs.image-summary.outputs.lane_result || needs.image-summary.result }}
          MIRROR_RESULT: ${{ needs.image-mirror-aliyun.result }}
        run: printf 'Admin primary=%s, mirrors=%s\n' "$PRIMARY_RESULT" "$MIRROR_RESULT" >> "$GITHUB_STEP_SUMMARY"
