name: YoyoBoot quality

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      build-target:
        type: string
        required: true
      quality-scopes-json:
        type: string
        required: true
    secrets:
      PRIVATE_SOURCE_REPOSITORY:
        required: true
      PRIVATE_SOURCE_PAT:
        required: true

permissions: {}

jobs:
  quality-gate:
    concurrency:
      group: yoyoboot-quality-${{ inputs.source-ref }}-${{ inputs.build-target }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      SOURCE_REF: ${{ inputs.source-ref }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - name: Check out requested private source revision
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source branch still points to requested commit
        shell: bash
        env:
          SOURCE_READ_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]
          remote_sha="$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${SOURCE_READ_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY}/commits/${SOURCE_REF}" | jq -r '.sha')"
          [[ "$remote_sha" == "$SOURCE_SHA" ]] || { echo 'Source ref moved after dispatch.' >&2; exit 1; }
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run repository-owned build and test quality gate
        shell: pwsh
        working-directory: source
        run: >-
          ./scripts/public-build-runner/quality/Invoke-YoyoBootPublicQualityGate.ps1
          -OutputDirectory "$env:RUNNER_TEMP/yoyoboot-quality-gate"
          -ScopesJson '${{ inputs.quality-scopes-json }}'
          -SkipDocumentation
      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yoyoboot-quality-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-quality-gate
          if-no-files-found: warn
