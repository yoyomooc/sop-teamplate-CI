name: 提交编译与测试

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      source-run-id:
        type: string
        required: true
      build-target:
        type: string
        required: true
      quality-scopes-json:
        type: string
        required: true
    secrets:
      PRIVATE_SOURCE_REPOSITORY:
        required: true
      PRIVATE_SOURCE_PAT:
        required: true

permissions: {}

jobs:
  quality-gate:
    concurrency:
      group: yoyoboot-quality-${{ inputs.source-ref }}-${{ inputs.build-target }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      SOURCE_REF: ${{ inputs.source-ref }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      SOURCE_RUN_ID: ${{ inputs.source-run-id }}
    steps:
      - name: Check out requested private source revision
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source branch still points to requested commit
        shell: bash
        env:
          SOURCE_READ_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]
          remote_sha="$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${SOURCE_READ_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY}/commits/${SOURCE_REF}" | jq -r '.sha')"
          [[ "$remote_sha" == "$SOURCE_SHA" ]] || { echo 'Source ref moved after dispatch.' >&2; exit 1; }
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install global pnpm
        run: npm install --global pnpm@12.16.1
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: source/global.json
      - name: Record .NET SDK and source
        shell: bash
        working-directory: source
        run: echo "SDK $(dotnet --version); source $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Download selected engineering scope
        uses: actions/download-artifact@v5
        with:
          name: yoyoboot-quality-plan-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-quality-plan
      - name: Start required Redis test service
        if: ${{ contains(fromJSON(inputs.quality-scopes-json), 'redis') || contains(fromJSON(inputs.quality-scopes-json), 'backend-compat') || contains(fromJSON(inputs.quality-scopes-json), 'full') }}
        shell: bash
        run: |
          docker run -d --name yoyo-quality-redis -p 127.0.0.1:16389:6379 redis:7.4.1
          for attempt in {1..30}; do
            if docker exec yoyo-quality-redis redis-cli ping | grep -q PONG; then
              echo 'YOYO_LEASE_TEST_REDIS=127.0.0.1:16389,allowAdmin=true' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs yoyo-quality-redis
          exit 1
      - name: Run repository-owned build and test quality gate
        shell: pwsh
        working-directory: source
        run: >-
          ./scripts/public-build-runner/quality/Invoke-YoyoBootPublicQualityGate.ps1
          -OutputDirectory "$env:RUNNER_TEMP/yoyoboot-quality-gate"
          -ScopePlanPath "$env:RUNNER_TEMP/yoyoboot-quality-plan/quality-scope.json"
          -SkipDocumentation
      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yoyoboot-quality-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-quality-gate
          if-no-files-found: warn
      - name: Stop owned Redis test service
        if: ${{ always() && (contains(fromJSON(inputs.quality-scopes-json), 'redis') || contains(fromJSON(inputs.quality-scopes-json), 'backend-compat') || contains(fromJSON(inputs.quality-scopes-json), 'full')) }}
        run: docker rm -f yoyo-quality-redis
