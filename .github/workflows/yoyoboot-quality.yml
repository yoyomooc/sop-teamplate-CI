name: 提交编译与测试

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      source-run-id:
        type: string
        required: true
      build-target:
        type: string
        required: true
    secrets:
      PRIVATE_SOURCE_REPOSITORY:
        required: true
      PRIVATE_SOURCE_PAT:
        required: true

permissions: {}

jobs:
  quality-gate:
    concurrency:
      group: yoyoboot-quality-${{ inputs.source-ref }}-${{ inputs.build-target }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      SOURCE_REF: ${{ inputs.source-ref }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      SOURCE_RUN_ID: ${{ inputs.source-run-id }}
    steps:
      - name: Check out requested private source revision
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify requested validation source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - name: Download selected engineering scope
        uses: actions/download-artifact@v5
        with:
          name: yoyoboot-quality-plan-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-quality-plan
      - name: Read planned runtime requirements
        id: runtime
        shell: pwsh
        run: |
          $plan = Get-Content "$env:RUNNER_TEMP/yoyoboot-quality-plan/validation-plan.json" -Raw | ConvertFrom-Json
          $node = $plan.runtime.node
          $dotnet = $plan.runtime.dotnet
          Add-Content $env:GITHUB_OUTPUT "node=$($node.ToString().ToLowerInvariant())"
          Add-Content $env:GITHUB_OUTPUT "dotnet=$($dotnet.ToString().ToLowerInvariant())"
          Add-Content $env:GITHUB_OUTPUT "redis=$($plan.runtime.redis.ToString().ToLowerInvariant())"
      - uses: actions/setup-node@v6
        if: ${{ steps.runtime.outputs.node == 'true' }}
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install global pnpm
        if: ${{ steps.runtime.outputs.node == 'true' }}
        run: npm install --global pnpm@12.16.1
      - uses: actions/setup-dotnet@v5
        if: ${{ steps.runtime.outputs.dotnet == 'true' }}
        with:
          global-json-file: source/global.json
      - name: Record .NET SDK and source
        if: ${{ steps.runtime.outputs.dotnet == 'true' }}
        shell: bash
        working-directory: source
        run: echo "SDK $(dotnet --version); source $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Start required Redis test service
        continue-on-error: true
        if: ${{ steps.runtime.outputs.redis == 'true' }}
        shell: bash
        run: |
          docker run -d --name yoyo-quality-redis -p 127.0.0.1:16389:6379 redis:7.4.1
          for attempt in {1..30}; do
            if docker exec yoyo-quality-redis redis-cli ping | grep -q PONG; then
              echo 'YOYO_LEASE_TEST_REDIS=127.0.0.1:16389,allowAdmin=true' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs yoyo-quality-redis
          exit 1
      - name: Run repository-owned build and test quality gate
        shell: pwsh
        working-directory: source
        run: >-
          ./scripts/public-build-runner/quality/Invoke-YoyoBootPublicQualityGate.ps1
          -OutputDirectory "$env:RUNNER_TEMP/yoyoboot-quality-gate"
          -ScopePlanPath "$env:RUNNER_TEMP/yoyoboot-quality-plan/quality-scope.json"
      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yoyoboot-quality-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/yoyoboot-quality-gate
          if-no-files-found: warn
      - name: Stop owned Redis test service
        if: ${{ always() && steps.runtime.outputs.redis == 'true' }}
        run: docker rm -f yoyo-quality-redis
